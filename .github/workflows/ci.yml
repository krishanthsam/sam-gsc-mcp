name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        mcp-sdk: ["mcp>=1.10,<2", "mcp>=2,<3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.mcp-sdk }}"
      - name: Test
        run: pytest -q
      - name: Server boots and lists tools
        run: python -c "import asyncio; from sam_gsc_mcp import server; print(len(asyncio.run(server.mcp.list_tools())), 'tools')"
