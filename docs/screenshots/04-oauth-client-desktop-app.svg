Arial, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="start" xml:space="preserve" style="white-space:pre">Copy the full path</text><text x="880" y="377" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" xml:space="preserve" style="white-space:pre">You'll paste it into</text><text x="880" y="396" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" xml:space="preserve" style="white-space:pre">GSC_OAUTH_CLIENT_SECRETS_FILE</text><rect x="838" y="533" width="308" height="92" rx="8" fill="#fef3c7"/><text x="852" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#b45309" text-anchor="start" xml:space="preserve" style="white-space:pre">Keep this file private.</text><text x="852" y="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="start" xml:space="preserve" style="white-space:pre">Never commit it to GitHub — the repo's</text><text x="852" y="602" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="start" xml:space="preserve" style="white-space:pre">.gitignore already blocks common names.</text></svg>
