 properties</text><circle cx="857" cy="388" r="13" fill="#f97316" stroke="#ffffff" stroke-width="2.5"/><text x="857" y="393" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" xml:space="preserve" style="white-space:pre">4</text><text x="880" y="393" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827" text-anchor="start" xml:space="preserve" style="white-space:pre">Close the tab</text><text x="880" y="415" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6b7280" text-anchor="start" xml:space="preserve" style="white-space:pre">Token is saved; no more logins</text><rect x="838" y="533" width="308" height="92" rx="8" fill="#fef3c7"/><text x="852" y="558" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#b45309" text-anchor="start" xml:space="preserve" style="white-space:pre">"Error 403: access_denied"?</text><text x="852" y="580" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="start" xml:space="preserve" style="white-space:pre">Add your Gmail as a Test user (Step 3)</text><text x="852" y="602" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#b45309" text-anchor="start" xml:space="preserve" style="white-space:pre">or publish the app.</text></svg>
