no-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#c4b5fd" text-anchor="start" xml:space="preserve" style="white-space:pre">        "GSC_OAUTH_CLIENT_SECRETS_FILE":</text><text x="62" y="404" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#475569" text-anchor="start" xml:space="preserve" style="white-space:pre">10</text><text x="100" y="404" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#c4b5fd" text-anchor="start" xml:space="preserve" style="white-space:pre">          "/Users/you/secure/client_secrets.json",</text><text x="62" y="432" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#475569" text-anchor="start" xml:space="preserve" style="white-space:pre">11</text><text x="100" y="432" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#f9a8d4" text-anchor="start" xml:space="preserve" style="white-space:pre">        "GSC_SITE_URL": "sc-domain:example.com"</text><text x="62" y="460" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#475569" text-anchor="start" xml:space="preserve" style="white-space:pre">12</text><text x="100" y="460" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor="start" xml:space="preserve" style="white-space:pre">      }</text><text x="62" y="488" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#475569" text-anchor="start" xml:space="preserve" style="white-space:pre">13</text><text x="100" y="488" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#e5e7eb" text-anchor